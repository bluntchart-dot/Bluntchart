name: Generate book (dispatch)

# Triggered by the Gumroad webhook via repository_dispatch.
# Each run processes ONE specific payment — the paymentId from the
# client_payload. No concurrency group: multiple payments can generate
# in parallel. Global capacity (max 2) is enforced by a database
# COUNT check inside the worker before claiming.

on:
  repository_dispatch:
    types: [generate-book]
  workflow_dispatch:
    inputs:
      payment_id:
        description: "Payment ID to process (leave empty for watchdog mode)"
        required: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run worker
        env:
          PAYMENT_ID: ${{ github.event.client_payload.paymentId || github.event.inputs.payment_id || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BOOK_GENERATION_CONCURRENCY: "2"
          NEXT_PUBLIC_SITE_URL: "https://bluntchart.com"
        run: npx tsx scripts/generate-book-worker.ts
